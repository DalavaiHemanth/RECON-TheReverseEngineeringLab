<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="recon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Radar Reticle Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8 4" opacity="0.75" />

  <!-- Inner Hexagon Target -->
  <polygon points="32,18 44,25 44,39 32,46 20,39 20,25" fill="none" stroke="url(#recon-grad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Crosshairs -->
  <line x1="32" y1="8" x2="32" y2="15" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="49" x2="32" y2="56" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  <line x1="8" y1="32" x2="15" y2="32" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  <line x1="49" y1="32" x2="56" y2="32" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Central Target Nucleus -->
  <circle cx="32" cy="32" r="4.5" fill="#10b981" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />
</svg>
